bundle: quick-search
version: 1
layer: QBIT
# Help for the Quick Search Admin app and every quick_search_* table, in the QQQ
# help-bundle format (qqq#1198). Each table entry says what the table is for and
# how its rows get created, so an empty table explains itself. QuickSearchHelp
# applies it until the core HelpBundles registry ships in a QQQ release
# (a stand-in for core#1198). Summaries stay under 120 characters
# (QuickSearchTablesGuardrailTest).
entries:
  - key: app:quickSearchAdmin;slot:help
    summary: "Watch and tune full-text search: which tables are indexed, how they build, and whether search is healthy."
    content: |
      Nothing needs to be set up by hand. On startup the qbit reads the tables your code marks searchable and writes the index and field rows itself (see Search Indexes). Add a table with Add Search Index, change weights on Searchable Fields, and use Pause Indexing as the emergency stop. The home shows whether OpenSearch is reachable and what the last startup priming changed.

  - key: table:quick_search_index;slot:help
    summary: "One row per table that is searchable: whether it is indexed, how often it refreshes, and how its last build went."
    content: |
      **How rows get created:** automatically. On startup the qbit adds a row for every table declared searchable in code (@QuickSearchable or the host's searchable tables) and queues its first build. Add a table yourself with the Add Search Index action; Disable or Remove Search Index stops indexing it. A table you removed is remembered (Removed Config) and not added back. Change the interval or the fields, then run Apply Search Index Changes to rebuild.

  - key: table:quick_search_index_field;slot:help
    summary: "The fields of each indexed table that search looks at, with their weight and analyzer."
    content: |
      **How rows get created:** automatically, with the index row, from the field annotations or the host's field list. Edit a weight to make matches in that field rank higher, or add a field by hand; your edits are kept and never overwritten by startup. Changes take effect after Apply Search Index Changes rebuilds the table.

  - key: table:quick_search_settings;slot:help
    summary: "The single settings row: the indexing pause switch and what startup priming last did."
    content: |
      **How rows get created:** the qbit creates the one row (id 1) on first startup; do not add others. Use the Pause Indexing and Resume Indexing actions to stop and restart all indexing while search keeps answering from the existing index. The priming fields are written by the qbit and are read-only.

  - key: table:quick_search_config_tombstone;slot:help
    summary: "Tables and fields you removed from search, so startup does not add them back."
    content: |
      **How rows get created:** this table starts empty on purpose. A row appears when you Remove Search Index or remove a field that code still declares as searchable. Delete a row to let the code defaults add that table or field again on the next startup.

  - key: table:quick_search_index_run;slot:help
    summary: "History of every index build, refresh and reconcile: when it ran, how many records, and how it ended."
    content: |
      **How rows get created:** by the qbit itself. Each Full Reindex, Basepull (the scheduled refresh) and Reconcile writes a row, and the first build of a new index writes the first one. Nothing to set up. Cancel Index Run stops one that is still running. Old rows are purged after the run history retention period.

  - key: table:quick_search_failed_event;slot:help
    summary: "Real-time index updates that failed and are waiting to be replayed."
    content: |
      **How rows get created:** by the qbit. When saving a record cannot update OpenSearch, the change is recorded here and the next refresh replays it. This table is normally empty, which is the healthy state. Rows that stay here mean OpenSearch is unreachable or rejecting a document; check the home status.

  - key: table:quick_search_diagnostic_event;slot:help
    summary: "Failed searches and a trail of diagnostic tool runs, kept for troubleshooting."
    content: |
      **How rows get created:** by the qbit. A search that hits an OpenSearch error or timeout writes a row (core search then falls back to its own), and so does each run of a diagnostic tool such as Search Playground. Rows are read-only. An empty table means no search has failed.

  - key: table:quick_search_validation_run;slot:help
    summary: "Results of each Validate Search Index check: pass, warnings and the full report."
    content: |
      **How rows get created:** run the Validate Search Index action from the Search Indexes table (it can also run on a schedule); each run writes one row with its status and report. It starts empty until someone validates. Rows are kept as history and purged after the run history retention period.
