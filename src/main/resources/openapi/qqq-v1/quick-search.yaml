components:
  schemas:
    BasicErrorResponseV1:
      description: "The error body of every UI API operation (core and extensions)."
      properties:
        error:
          description: "The error message (the same as message; kept for clients of\
            \ UI API 1.0 to 1.5)."
          type: "string"
        code:
          description: "A stable, machine-readable code. Well-known values: BAD_REQUEST\
            \ (400), UNAUTHENTICATED (401),\nPERMISSION_DENIED (403), NOT_FOUND (404),\
            \ CONFLICT (409), RATE_LIMITED (429), INTERNAL_ERROR (500),\nERROR (other).\
            \ Extensions may add codes; treat an unknown code by the HTTP status.\
            \ Since 1.6.0."
          type: "string"
        message:
          description: "A message to show the user. Since 1.6.0."
          type: "string"
        fieldErrors:
          description: "Errors about particular request fields, when known. Since\
            \ 1.6.0."
          items:
            properties:
              field:
                description: "The field (or parameter) name."
                type: "string"
              message:
                description: "The error about that field."
                type: "string"
              code:
                description: "An optional machine-readable code, e.g. REQUIRED, TOO_LONG,\
                  \ PATTERN."
                type: "string"
            type: "object"
          type: "array"
        traceId:
          description: "Identifies this request in the server logs (also the X-QQQ-Trace-Id\
            \ response header); quote it when reporting a problem. Since 1.6.0."
          type: "string"
      type: "object"
    QuickSearchErrorV1:
      description: "Deprecated since 1.1.0: errors use BasicErrorResponseV1."
      properties:
        error:
          description: "Framework error message."
          nullable: false
          type: "string"
      type: "object"
    QuickSearchIndexStatusV1:
      properties:
        countsCheckedAt:
          description: "Saved validation completion; null when validation counts are\
            \ unavailable."
          format: "date-time"
          nullable: true
          type: "string"
        documentCount:
          description: "Saved validation document count, else last indexing run count;\
            \ not live."
          format: "int64"
          nullable: true
          type: "integer"
        enabled:
          description: "Whether this index is enabled."
          nullable: false
          type: "boolean"
        lastError:
          description: "Persisted indexing error; null when absent."
          nullable: true
          type: "string"
        lastSuccessfulSync:
          description: "Newest successful basepull/full-reindex/reconcile watermark."
          format: "date-time"
          nullable: true
          type: "string"
        realTimeErrorCount:
          description: "Persisted real-time indexing error count."
          nullable: true
          type: "integer"
        sourceCount:
          description: "Source count from saved IndexValidator report; null without\
            \ validation."
          format: "int64"
          nullable: true
          type: "integer"
        status:
          description: "Persisted indexing state, such as ACTIVE or NEEDS_REINDEX."
          nullable: true
          type: "string"
        tableName:
          description: "Indexed source table metadata name."
          nullable: false
          type: "string"
      type: "object"
    QuickSearchStatusV1:
      properties:
        activeShards:
          description: "Cluster health counter; null when unavailable."
          nullable: true
          type: "integer"
        backlogTruncated:
          description: "Counts are lower bounds when more than 1000 backlog rows exist."
          nullable: false
          type: "boolean"
        checkedAt:
          description: "Snapshot completion time; remains unchanged on cache hits."
          format: "date-time"
          nullable: false
          type: "string"
        clusterHealth:
          description: "OpenSearch health color; null when unknown."
          nullable: true
          type: "string"
        clusterReachable:
          description: "Whether OpenSearch answered; null when not probed."
          nullable: true
          type: "boolean"
        exhausted:
          description: "Exhausted failed events, from the same bounded backlog read."
          nullable: true
          type: "integer"
        homeHref:
          description: "Quick Search home link, including the configured metadata\
            \ prefix."
          nullable: false
          type: "string"
        indexes:
          description: "At most 100 persisted index rows, ordered by id."
          items:
            $ref: "#/components/schemas/QuickSearchIndexStatusV1"
          type: "array"
        indexingPaused:
          description: "Indexing is paused; search can still serve."
          nullable: true
          type: "boolean"
        lastError:
          description: "Last known indexing/search error or snapshot failure; null\
            \ when absent."
          nullable: true
          type: "string"
        lastSuccessfulSync:
          description: "Newest successful indexing watermark; not a guarantee all\
            \ tables are current."
          format: "date-time"
          nullable: true
          type: "string"
        nodes:
          description: "Cluster health counter; null when unavailable."
          nullable: true
          type: "integer"
        pending:
          description: "Pending and awaiting-reindex failed events, from at most 1000\
            \ backlog rows."
          nullable: true
          type: "integer"
        state:
          description: "Overall availability; incomplete diagnostics are DEGRADED."
          enum:
          - "OK"
          - "DEGRADED"
          - "DOWN"
          - "DISABLED"
          nullable: false
          type: "string"
        tablesTruncated:
          description: "More than 100 index rows exist."
          nullable: false
          type: "boolean"
        unassignedShards:
          description: "Cluster health counter; null when unavailable."
          nullable: true
          type: "integer"
      type: "object"
    QuickSearchSuggestGroupV1:
      nullable: false
      properties:
        hasMore:
          description: "An extra accessible item was found in the bounded batch. False\
            \ does not prove the index has no further matches."
          nullable: false
          type: "boolean"
        items:
          description: "At most limitPerTable accessible items in per-table relevance\
            \ order."
          items:
            $ref: "#/components/schemas/QuickSearchSuggestItemV1"
          nullable: false
          type: "array"
        tableLabel:
          description: "Source table label, falling back to its metadata name."
          nullable: false
          type: "string"
        tableName:
          description: "Source table metadata name."
          nullable: false
          type: "string"
      type: "object"
    QuickSearchSuggestItemV1:
      nullable: false
      properties:
        label:
          description: "Filtered record label, falling back to tableLabel #recordId\
            \ when blank."
          nullable: false
          type: "string"
        recordId:
          description: "Source record primary key."
          nullable: false
          type: "string"
        subtitle:
          description: "Already-filtered result subtitle; null when absent."
          nullable: true
          type: "string"
      type: "object"
    QuickSearchSuggestV1:
      nullable: false
      properties:
        groups:
          description: "Readable tables ordered by best accessible score; at most\
            \ maxTables."
          items:
            $ref: "#/components/schemas/QuickSearchSuggestGroupV1"
          nullable: false
          type: "array"
        query:
          description: "Search term after trimming and collapsing whitespace."
          nullable: false
          type: "string"
        truncated:
          description: "More tables had accessible hits than maxTables."
          nullable: false
          type: "boolean"
      type: "object"
  securitySchemes:
    sessionUuidCookie:
      description: "The session cookie set by POST /qqq/v1/manageSession (web clients)."
      in: "cookie"
      name: "sessionUUID"
      type: "apiKey"
    bearerAuth:
      bearerFormat: "JWT or session UUID"
      description: "`Authorization: Bearer <token>`, where the token is either\n-\
        \ an OAuth2 access token (a signed JWT) issued by the app's identity provider\
        \ to the app's client,\n  or to its native client (`values.nativeClientId`\
        \ in GET /qqq/v1/metaData/authentication), for\n  example from the device-authorization\
        \ grant or auth-code + PKCE. It is verified against the\n  provider's keys\
        \ (issuer, audience, expiry, signature) and gives the same user and permissions\n\
        \  as signing in on the web. When it expires (401), refresh it at the provider\
        \ and retry; or\n- a session UUID returned by POST /qqq/v1/manageSession,\
        \ which the server keeps refreshed."
      scheme: "bearer"
      type: "http"
    oauth2:
      description: "The app's OAuth2 / OpenID Connect provider. The real endpoints\
        \ come from the provider's discovery\ndocument: `{values.baseUrl}.well-known/openid-configuration`,\
        \ with values from\nGET /qqq/v1/metaData/authentication. Native clients use\
        \ `values.nativeClientId` (a public client)\nwith auth-code + PKCE (loopback\
        \ or custom-scheme redirect URI registered at the provider) or the\ndevice-authorization\
        \ grant (`device_authorization_endpoint`, RFC 8628), then send the access\
        \ token\nas `Authorization: Bearer`."
      flows:
        authorizationCode:
          authorizationUrl: "/authorize"
          scopes:
            email: "Email address"
            offline_access: "A refresh token, to renew the access token without signing\
              \ in again"
            openid: "OpenID Connect sign-in"
            profile: "Name, username and groups (permissions come from the groups)"
          tokenUrl: "/token"
      type: "oauth2"
info:
  contact:
    email: "contact@kingsrook.com"
  description: "Quick Search administration and suggestions"
  title: "QQQ Middleware API extension: quick-search"
  version: "1.1.0"
openapi: "3.0.3"
paths:
  /qqq/v1/qbit/quick-search/status:
    get:
      description: "Requires Quick Search admin permission. Five-second instance cache;\
        \ two-second refresh wait. Counts are saved diagnostics, not live source scans.\
        \ Unknown values are null. Backlog counts are lower bounds when backlogTruncated\
        \ is true."
      operationId: "getQuickSearchStatus"
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Diagnostic rate limit exceeded"
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Sign in required"
        403:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Quick Search admin permission required"
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickSearchStatusV1"
          description: "Successful Response"
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not found, or not visible to this user (code NOT_FOUND)."
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Conflict with the current state, e.g. an edit conflict or\
            \ an invalid transition (code CONFLICT)."
        429:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Too many requests (code RATE_LIMITED); retry later."
      security:
      - sessionUuidCookie:
        - "N/A"
      - bearerAuth:
        - "N/A"
      - oauth2:
        - "openid"
        - "profile"
        - "email"
      summary: "Get Quick Search status"
      tags:
      - "quick-search"
  /qqq/v1/qbit/quick-search/suggest:
    get:
      description: "Requires a signed-in session, not Quick Search admin permission.\
        \ Results inherit table READ permissions, configured record security locks\
        \ and protected-field exclusions. One bounded candidate batch per table; no\
        \ extra scans. Unavailable search and normalized terms shorter than two characters\
        \ return empty groups."
      operationId: "getQuickSearchSuggestions"
      parameters:
      - description: "Search text: trim and collapse whitespace before applying the\
          \ 2..100 character range. Shorter terms return empty groups; longer terms\
          \ return 400."
        in: "query"
        name: "q"
        required: true
        schema:
          description: "Normalized search term."
          nullable: false
          type: "string"
      - description: "Items per table: integer 1..10, default 5."
        in: "query"
        name: "limitPerTable"
        required: false
        schema:
          description: "Maximum items per table; default 5, maximum 10."
          nullable: false
          type: "integer"
      - description: "Groups to return: integer 1..20, default 8."
        in: "query"
        name: "maxTables"
        required: false
        schema:
          description: "Maximum groups; default 8, maximum 20."
          nullable: false
          type: "integer"
      - description: "Optional comma-separated table metadata names. Unknown, disabled\
          \ and unreadable tables are omitted."
        in: "query"
        name: "tables"
        required: false
        schema:
          description: "Table-name filter; omitted means all eligible tables."
          nullable: false
          type: "string"
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Missing q, normalized term longer than 100 characters, or\
            \ invalid limits"
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Sign in required"
        403:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Session permission denied"
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickSearchSuggestV1"
          description: "Successful Response"
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not found, or not visible to this user (code NOT_FOUND)."
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Conflict with the current state, e.g. an edit conflict or\
            \ an invalid transition (code CONFLICT)."
        429:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Too many requests (code RATE_LIMITED); retry later."
      security:
      - sessionUuidCookie:
        - "N/A"
      - bearerAuth:
        - "N/A"
      - oauth2:
        - "openid"
        - "profile"
        - "email"
      summary: "Get Quick Search suggestions"
      tags:
      - "quick-search"
servers:
- description: "The QQQ server that serves this document (paths include /qqq/v1)."
  url: "/"
tags:
- description: "Operations of the quick-search extension."
  name: "quick-search"
