version: 2.1

orbs:
  qqq-orb: kingsrook/qqq-orb@0.5.2

workflows:

  test_only:
    jobs:
      - qqq-orb/mvn_test_only:
          context: [ qqq-maven-registry-credentials ]
          filters:
            branches:
              ignore: /(develop|main|release/.*|hotfix/.*|integration.*)/

  publish_snapshot:
    jobs:
      - qqq-orb/mvn_publish:
          context: [ qqq-maven-registry-credentials ]
          branch_type: snapshot
          filters:
            branches:
              only:
                - develop

  publish_release:
    jobs:
      - qqq-orb/mvn_publish:
          context: [ qqq-maven-registry-credentials ]
          branch_type: release
          filters:
            branches:
              only: [ main ]
